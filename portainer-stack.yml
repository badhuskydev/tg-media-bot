# Portainer stack (Repository deploy). Builds the bot from this repo on every
# deploy; secrets come from the stack's environment variables in Portainer.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tg-bot-api
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  bot:
    build:
      context: .
    image: tg-media-bot:local
    pull_policy: build
    container_name: tg-media-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      API_SERVER_URL: http://telegram-bot-api:8081
      USE_BROWSER_COOKIES: "false"
      COOKIES_FILE: /cookies/cookies.txt
      LOG_FILE: /data/tg-media-bot.log
      ALLOWED_CHATS_FILE: /data/allowed_chats.json
      MEDIA_CACHE_FILE: /data/media_cache.json
      MINIMAL_MODE_FILE: /data/minimal_mode.json
      TOPIC_LOCK_FILE: /data/topic_locks.json
      PLUGIN_DIR: /plugins
      LOG_LEVEL: INFO
      TZ: America/Denver
    volumes:
      - bot-downloads:/tmp/tg-media-bot
      - bot-data:/data
      - bot-cookies:/cookies
      - bot-plugins:/plugins
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bot-api-data:
  bot-downloads:
  bot-data:
  bot-cookies:
  bot-plugins:
